<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gongoni 27 API</title>
  <style>
    :root {
      --bg: #f4f6f5;
      --card: #ffffff;
      --text: #1b2420;
      --muted: #5f6b66;
      --ok: #1f9d55;
      --ok-soft: #e3f5ea;
      --border: #e1e6e3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1412;
        --card: #171e1b;
        --text: #e8eeeb;
        --muted: #93a19b;
        --ok: #3ccf7a;
        --ok-soft: #173325;
        --border: #26302c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--ok-soft);
      color: var(--ok);
      font-weight: 600;
      font-size: 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .35; } }
    h1 { margin: 20px 0 6px; font-size: 24px; }
    p { margin: 0; color: var(--muted); }
    dl {
      margin: 24px 0 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 16px;
      text-align: left;
      font-size: 14px;
    }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    a { color: var(--ok); }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge"><span class="dot"></span>Server running</span>
    <h1>{{ service }}</h1>
    <p>The backend is up and responding to requests.</p>
    <dl>
      <dt>Status</dt><dd>{{ status }}</dd>
      <dt>Environment</dt><dd>{% if debug %}Development{% else %}Production{% endif %}</dd>
      <dt>Server time</dt><dd>{{ server_time|date:"Y-m-d H:i:s T" }}</dd>
      <dt>API</dt><dd><a href="/api/">/api/</a></dd>
    </dl>
  </main>
</body>
</html>
