[build]
builder = "NIXPACKS"
buildCommand = "cd backend && python manage.py collectstatic --noinput"

[deploy]
startCommand = "cd backend && python manage.py migrate && gunicorn gongoni.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
healthcheckPath = "/"

[env]
DJANGO_DEBUG = "0"
DJANGO_ALLOWED_HOSTS = "*.railway.app"
DJANGO_CSRF_TRUSTED_ORIGINS = "https://*.railway.app"
EMAIL_BACKEND_MODE = "console"
SMS_BACKEND = "console"
