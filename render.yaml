services:
  - type: web
    name: gongoni-27
    env: python
    buildCommand: pip install -r requirements.txt && cd backend && python manage.py collectstatic --noinput
    startCommand: cd backend && gunicorn gongoni.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: 0
      - key: DJANGO_ALLOWED_HOSTS
        value: *.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: gongoni-db
          property: connectionString
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: EMAIL_BACKEND_MODE
        value: console
      - key: SMS_BACKEND
        value: console

databases:
  - name: gongoni-db
    databaseName: gongoni27
    user: gongoni_user
